[package]
name = "scalia-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
scalia-core = { path = "../scalia-core" }
scalia-ai = { path = "../scalia-ai" }
scalia-blueprint = { path = "../scalia-blueprint" }
wasm-bindgen = "=0.2.130"
scalia-render = { path = "../scalia-render" }
glam = "0.34"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
