[package]
name = "scalia-render"
version = "0.1.0"
edition = "2021"

[dependencies]
glam = "0.34"
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl"] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
regex = "1"
# AN-03: tests/skin_gpu.rs runs the skinning compute pass on a software Vulkan adapter (lavapipe) when one exists.
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl", "vulkan"] }
pollster = "0.4"
