<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scalia debug: blueprints and planet</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 0; background: #12151a; color: #d8dde6; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; } h2 { font-size: 17px; margin-top: 32px; }
  #blueprints { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: #1b2028; border: 1px solid #2b3340; border-radius: 6px; padding: 12px; }
  .card svg { width: 100%; height: 200px; background: #0e1116; }
  .card svg .hull { stroke: #6a7a90; stroke-width: 20; } .card svg .room { stroke-width: 14; }
  .meta { font-size: 13px; color: #98a3b3; margin-top: 6px; word-break: break-all; }
  label { margin-right: 12px; } input, select { background: #0e1116; color: inherit; border: 1px solid #2b3340; padding: 3px 6px; width: 90px; }
  canvas { image-rendering: pixelated; border: 1px solid #2b3340; margin-top: 12px; width: 520px; height: 520px; max-width: 100%; }
  #view { width: 960px; height: 540px; max-width: 100%; image-rendering: pixelated; margin-top: 8px; }
  .bar button, .bar select { margin-right: 8px; background: #1b2028; color: inherit; border: 1px solid #2b3340; padding: 4px 10px; }
  #status { color: #98a3b3; }
</style>
</head>
<body>
<main>
  <h1>Scalia debug: blueprints and planet</h1>
  <p><a href="./" style="color:#9cc4ff">Back to the game</a></p>
  <p id="status">Loading WebAssembly...</p>
  <h2>Shipped blueprints</h2>
  <div id="blueprints"></div>
  <h2>Planet chunk</h2>
  <p>
    <label>seed <input id="seed" type="number" value="42" min="0"></label>
    <label>chunk x <input id="cx" type="number" value="0"></label>
    <label>chunk y <input id="cy" type="number" value="16000"></label>
  </p>
  <canvas id="map" width="65" height="65"></canvas>
  <p id="mapinfo" class="meta"></p>
</main>
<script type="module" src="./debug.js"></script>
</body>
</html>
