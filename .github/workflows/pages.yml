name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain and wasm target
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: wasm-bindgen-cli-0.2.130
      - name: Install wasm-bindgen-cli
        run: command -v wasm-bindgen >/dev/null || cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build wasm for the web
        run: |
          cargo build --release --target wasm32-unknown-unknown -p scalia-wasm
          wasm-bindgen --target web --out-dir web/pkg target/wasm32-unknown-unknown/release/scalia_wasm.wasm
      - name: Stamp the build so browsers never run a stale cached copy
        run: |
          v=${GITHUB_SHA::7}
          sed -i "s#'./pkg/scalia_wasm.js'#'./pkg/scalia_wasm.js?v=$v'#" web/game.js web/debug.js
          sed -i "s#scalia_wasm_bg.wasm', import.meta.url#scalia_wasm_bg.wasm?v=$v', import.meta.url#" web/pkg/scalia_wasm.js
          sed -i "s#src=\"./game.js\"#src=\"./game.js?v=$v\"#; s#src=\"./debug.js\"#src=\"./debug.js?v=$v\"#" web/*.html
          grep -c "v=$v" web/game.js web/pkg/scalia_wasm.js web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
