name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the update number counts every change so far
      - name: Rust toolchain and wasm target
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: wasm-bindgen-cli-0.2.130
      - name: Install wasm-bindgen-cli
        run: command -v wasm-bindgen >/dev/null || cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build wasm for the web
        run: |
          cargo build --release --target wasm32-unknown-unknown -p scalia-wasm
          wasm-bindgen --target web --out-dir web/pkg target/wasm32-unknown-unknown/release/scalia_wasm.wasm
      - name: Stamp the build so browsers never run a stale cached copy
        run: |
          v=${GITHUB_SHA::7}
          sed -i "s#'./pkg/scalia_wasm.js'#'./pkg/scalia_wasm.js?v=$v'#" web/game.js web/debug.js web/models.js
          sed -i "s#scalia_wasm_bg.wasm', import.meta.url#scalia_wasm_bg.wasm?v=$v', import.meta.url#" web/pkg/scalia_wasm.js
          sed -i "s#src=\"./game.js\"#src=\"./game.js?v=$v\"#; s#src=\"./debug.js\"#src=\"./debug.js?v=$v\"#; s#src=\"./models.js\"#src=\"./models.js?v=$v\"#" web/*.html
          # Images and sounds too: a changed picture under the same name must not come from the cache.
          sed -i -E "s#\./(img|sfx)/([A-Za-z0-9_.-]+\.(webp|png|mp3))#./\1/\2?v=$v#g" web/*.html web/game.js
          # Updates are named by area with a running number per area, e.g. "Tablet update V 001": the area is the
          # commit's "Update:" trailer (no trailer: "Build"), the number counts that area's updates so far.
          area=$(git log -1 --format='%(trailers:key=Update,valueonly)' | head -1 | xargs)
          if [ -z "$area" ]; then area=Build; count=$(git rev-list --count HEAD); else
            count=$(git log --format='%(trailers:key=Update,valueonly)' | xargs -L1 | grep -cxF "$area"); fi
          n=$(printf '%s update V %03d' "$area" "$count")
          title=""
          sed -i "s#__UPDATE__#$n#" web/game.js
          python3 -c 'import json,sys; print(json.dumps({"v": sys.argv[1], "n": sys.argv[2], "title": sys.argv[3]}))' "$v" "$n" "$title" > web/version.json
          grep -c "v=$v" web/game.js web/pkg/scalia_wasm.js web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
