name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "work/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust, animation, benchmarks and WASM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust stable and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache wasm-bindgen CLI
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: wasm-bindgen-cli-0.2.130-${{ runner.os }}

      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Run the complete verification suite
        run: bash scripts/check.sh

      - name: Preserve verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalia-verification-log
          path: /tmp/verify.log
          if-no-files-found: warn
          retention-days: 14
